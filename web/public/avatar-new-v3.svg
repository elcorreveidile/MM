<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460">
  <defs>
    <linearGradient id="n3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63535;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C22A2A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="460" height="460" fill="url(#n3bg)" />

  <!-- Brush stroke header -->
  <rect x="40" y="28" width="380" height="42" rx="4" fill="#1A1A1A" transform="rotate(-1.5 230 49)" />
  <text x="230" y="57" text-anchor="middle"
    font-family="'Georgia', serif"
    font-style="italic" font-weight="700" font-size="27" fill="#FFFFFF">
    El correveidile
  </text>

  <!-- Polaroid with Alhambra (tribute to original) -->
  <g transform="translate(265, 90) rotate(4)">
    <rect x="0" y="0" width="160" height="175" rx="2" fill="#FFFFFF" opacity="0.92" />
    <rect x="10" y="10" width="140" height="120" rx="1" fill="#1A1535" />
    <!-- Alhambra silhouette -->
    <g transform="translate(10, 50)">
      <circle cx="115" cy="15" r="6" fill="#F2BE2A" opacity="0.5" />
      <circle cx="115" cy="15" r="3" fill="#F2BE2A" opacity="0.8" />
      <circle cx="25" cy="18" r="1" fill="#FFFFFF" opacity="0.7" />
      <circle cx="60" cy="10" r="1" fill="#FFFFFF" opacity="0.5" />
      <circle cx="95" cy="22" r="0.8" fill="#FFFFFF" opacity="0.6" />
      <path d="M0,70 L0,50 L10,50 L10,40 L14,36 L18,40 L18,50 L30,50 L30,32 L34,28 L38,32 L38,45 L48,45 L48,35 L56,28 L64,35 L64,48 L72,48 L72,34 L78,30 L84,34 L84,44 L92,44 L92,36 L100,30 L108,36 L108,48 L118,48 L118,40 L126,36 L134,40 L134,50 L140,50 L140,70 Z" fill="#2A1A40" />
      <rect x="33" y="48" width="2" height="2" fill="#F2BE2A" opacity="0.5" rx="0.5" />
      <rect x="57" y="42" width="2" height="2" fill="#F2BE2A" opacity="0.4" rx="0.5" />
      <rect x="80" y="40" width="2" height="2" fill="#F2BE2A" opacity="0.4" rx="0.5" />
      <rect x="103" y="44" width="2" height="2" fill="#F2BE2A" opacity="0.4" rx="0.5" />
    </g>
    <text x="80" y="150" text-anchor="middle"
      font-family="'Georgia', serif" font-style="italic" font-size="12" fill="#444">
      Granada
    </text>
  </g>

  <!-- Left side: stacked identity words -->
  <g transform="translate(40, 105)">
    <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" opacity="0.9" letter-spacing="1">LENGUA</text>
    <text x="0" y="30" font-family="'Helvetica Neue', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" opacity="0.7" letter-spacing="1">POESÍA</text>
    <text x="0" y="60" font-family="'Helvetica Neue', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" opacity="0.5" letter-spacing="1">IA</text>
    <text x="0" y="86" font-family="'Helvetica Neue', sans-serif" font-weight="300" font-size="14" fill="#FFFFFF" opacity="0.4" letter-spacing="1">CULTURA</text>
    <text x="0" y="106" font-family="'Helvetica Neue', sans-serif" font-weight="300" font-size="14" fill="#FFFFFF" opacity="0.35" letter-spacing="1">EDUCACIÓN</text>
  </g>

  <!-- Central-bottom: large CVD -->
  <circle cx="145" cy="340" r="62" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
  <circle cx="145" cy="340" r="53" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.3" />

  <text x="145" y="353" text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="5">
    CVD
  </text>

  <!-- Right side: services/identity -->
  <g transform="translate(240, 300)">
    <text x="0" y="0" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.7">Docente CLM · UGR</text>
    <text x="0" y="22" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.6">Recetas lingüísticas</text>
    <text x="0" y="44" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.5">La Clase Digital</text>
    <text x="0" y="66" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.4">Olvidos de Granada</text>
    <text x="0" y="88" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.35">javier.soy</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="430" width="460" height="30" fill="#1A1A1A" opacity="0.2" />
  <text x="230" y="450" text-anchor="middle"
    font-family="'Helvetica Neue', sans-serif"
    font-weight="300" font-size="11" fill="#FFFFFF" opacity="0.6" letter-spacing="3">
    ELCORREVEIDILE.COM
  </text>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.55">
    <polygon points="225,82 227,75 229,82 236,84 229,86 227,93 225,86 218,84" />
    <polygon points="430,100 432,94 434,100 440,102 434,104 432,110 430,104 424,102" />
  </g>

  <!-- Heart -->
  <g fill="#FFFFFF" opacity="0.35" transform="translate(430, 420) scale(0.7)">
    <path d="M10,6 C10,2 6,0 3,3 C0,0 -4,2 -4,6 C-4,10 3,14 3,14 C3,14 10,10 10,6 Z" />
  </g>
</svg>
