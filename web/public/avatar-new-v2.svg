<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460">
  <defs>
    <linearGradient id="n2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E83A3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D42E2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B82424;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="460" height="460" rx="32" ry="32" fill="url(#n2bg)" />

  <!-- Brush stroke header -->
  <rect x="30" y="32" width="400" height="44" rx="4" fill="#1A1A1A" transform="rotate(-1.5 230 54)" />
  <text x="230" y="62" text-anchor="middle"
    font-family="'Georgia', serif"
    font-style="italic" font-weight="700" font-size="28" fill="#FFFFFF">
    El correveidile
  </text>

  <!-- Hexagonal grid of activities (honeycomb layout) -->
  <!-- Row 1: 3 hexagons -->
  <g transform="translate(115, 130)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="0" y="3" text-anchor="middle" font-family="'Georgia', serif" font-size="14" fill="#FFFFFF" opacity="0.85">ELE</text>
  </g>
  <g transform="translate(175, 130)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="0" y="3" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#FFFFFF" opacity="0.85">IA</text>
  </g>
  <g transform="translate(235, 130)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="0" y="4" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#FFFFFF" opacity="0.85">&#x270E;</text>
  </g>
  <g transform="translate(295, 130)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
    <path d="M-8,6 L-8,-2 Q0,-12 8,-2 L8,6" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85" transform="translate(0,-2)" />
  </g>
  <g transform="translate(355, 130)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="0" y="3" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#FFFFFF" opacity="0.85">&lt;/&gt;</text>
  </g>

  <!-- Central area: large "javier" personal brand -->
  <text x="230" y="225" text-anchor="middle"
    font-family="'Georgia', serif"
    font-style="italic" font-size="16" fill="#FFFFFF" opacity="0.5" letter-spacing="2">
    javier.soy
  </text>

  <!-- CVD monogram - framed -->
  <rect x="130" y="240" width="200" height="120" rx="6" fill="#FFFFFF" opacity="0.08" />
  <rect x="140" y="250" width="180" height="100" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

  <text x="230" y="315" text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="900" font-size="58" fill="#FFFFFF" letter-spacing="8">
    CVD
  </text>

  <text x="230" y="392" text-anchor="middle"
    font-family="'Helvetica Neue', sans-serif"
    font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="2">
    LENGUA · IA · POESÍA
  </text>

  <text x="230" y="418" text-anchor="middle"
    font-family="'Georgia', serif"
    font-style="italic" font-size="13" fill="#FFFFFF" opacity="0.5" letter-spacing="1">
    educación · cultura · tecnología
  </text>

  <!-- Alhambra mini silhouette at bottom -->
  <g transform="translate(130, 438) scale(0.8)" opacity="0.2">
    <path d="M0,20 L0,12 L8,12 L8,6 L12,3 L16,6 L16,12 L28,12 L28,4 L32,1 L36,4 L36,10 L44,10 L44,4 L52,0 L60,4 L60,12 L68,12 L68,6 L76,2 L84,6 L84,12 L96,12 L96,6 L104,2 L112,6 L112,12 L120,12 L120,8 L128,4 L136,8 L136,12 L148,12 L148,8 L156,4 L164,8 L164,12 L180,12 L180,20 Z" fill="#FFFFFF" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.6">
    <polygon points="45,25 47,18 49,25 56,27 49,29 47,36 45,29 38,27" />
    <polygon points="418,28 420,21 422,28 429,30 422,32 420,39 418,32 411,30" />
  </g>
</svg>
