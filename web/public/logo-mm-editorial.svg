<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2BE2A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8B420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A520;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Solid background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg3)" />

  <!-- Diagonal decorative line (editorial style) -->
  <line x1="0" y1="0" x2="512" y2="512" stroke="#8B1A1A" stroke-width="0.5" opacity="0.1" />
  <line x1="512" y1="0" x2="0" y2="512" stroke="#8B1A1A" stroke-width="0.5" opacity="0.1" />

  <!-- Top ornamental bar -->
  <rect x="60" y="80" width="392" height="3" fill="#8B1A1A" opacity="0.6" />
  <rect x="60" y="88" width="392" height="1" fill="#8B1A1A" opacity="0.3" />

  <!-- Mariano -->
  <text x="256" y="135" text-anchor="middle"
    font-family="'Libre Franklin', 'Helvetica Neue', sans-serif"
    font-weight="300" font-size="22" fill="#8B1A1A" letter-spacing="14" opacity="0.6">
    MARIANO
  </text>

  <!-- Large MM monogram with custom paths for elegance -->
  <text x="256" y="310" text-anchor="middle" dominant-baseline="central"
    font-family="'Crimson Text', 'Georgia', serif"
    font-weight="700" font-size="260" fill="#8B1A1A" letter-spacing="-12">
    MM
  </text>

  <!-- Maresca -->
  <text x="256" y="395" text-anchor="middle"
    font-family="'Libre Franklin', 'Helvetica Neue', sans-serif"
    font-weight="300" font-size="22" fill="#8B1A1A" letter-spacing="14" opacity="0.6">
    MARESCA
  </text>

  <!-- Bottom ornamental bar -->
  <rect x="60" y="424" width="392" height="1" fill="#8B1A1A" opacity="0.3" />
  <rect x="60" y="430" width="392" height="3" fill="#8B1A1A" opacity="0.6" />

  <!-- Year -->
  <text x="256" y="472" text-anchor="middle"
    font-family="'Libre Franklin', 'Helvetica Neue', sans-serif"
    font-weight="300" font-size="16" fill="#8B1A1A" letter-spacing="6" opacity="0.45">
    1945 - 2023
  </text>
</svg>
