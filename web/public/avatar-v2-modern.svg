<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460">
  <defs>
    <linearGradient id="redBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E83A3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D42E2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B82424;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square with rounded corners -->
  <rect x="0" y="0" width="460" height="460" rx="40" ry="40" fill="url(#redBg2)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="460" height="6" rx="3" fill="#1A1A1A" opacity="0.3" />

  <!-- Large CORREVEIDILE text as background texture -->
  <text x="230" y="445" text-anchor="middle"
    font-family="'Impact', 'Arial Black', sans-serif"
    font-weight="900" font-size="62" fill="#000000" opacity="0.08" letter-spacing="2">
    CORREVEIDILE
  </text>

  <!-- Brush stroke -->
  <rect x="50" y="55" width="360" height="48" rx="4" fill="#1A1A1A" transform="rotate(-1.5 230 79)" />

  <!-- El correveidile -->
  <text x="230" y="88" text-anchor="middle"
    font-family="'Georgia', 'Palatino', serif"
    font-style="italic" font-weight="700" font-size="32" fill="#FFFFFF" letter-spacing="0.5">
    El correveidile
  </text>

  <!-- Wavy line separator -->
  <path d="M80,120 Q120,110 160,120 Q200,130 240,120 Q280,110 320,120 Q360,130 380,120"
    fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" />

  <!-- Subtitle -->
  <text x="230" y="155" text-anchor="middle"
    font-family="'Georgia', serif"
    font-style="italic" font-size="16" fill="#FFFFFF" opacity="0.7" letter-spacing="0.5">
    Clases, visitas, literatura y cocina
  </text>

  <!-- Central CVD badge -->
  <rect x="145" y="185" width="170" height="130" rx="8" fill="#FFFFFF" opacity="0.12" />
  <rect x="155" y="195" width="150" height="110" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

  <text x="230" y="265" text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="900" font-size="60" fill="#FFFFFF" letter-spacing="8">
    CVD
  </text>

  <!-- .com -->
  <text x="230" y="290" text-anchor="middle"
    font-family="'Helvetica Neue', sans-serif"
    font-weight="300" font-size="11" fill="#FFFFFF" opacity="0.5" letter-spacing="3">
    ELCORREVEIDILE.COM
  </text>

  <!-- Bottom section -->
  <line x1="80" y1="340" x2="380" y2="340" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3" />

  <!-- Visitas linguisticas -->
  <text x="230" y="375" text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="3">
    VISITAS
  </text>
  <text x="230" y="405" text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-weight="300" font-size="20" fill="#FFFFFF" letter-spacing="5" opacity="0.8">
    LINGÜÍSTICAS
  </text>

  <!-- Sparkle decorations -->
  <g fill="#FFFFFF" opacity="0.6">
    <polygon points="52,30 55,20 58,30 68,33 58,36 55,46 52,36 42,33" />
    <polygon points="405,35 407,28 409,35 416,37 409,39 407,46 405,39 398,37" />
    <polygon points="420,140 422,135 424,140 429,142 424,144 422,149 420,144 415,142" transform="scale(0.8)" />
  </g>

  <!-- Heart -->
  <g fill="#FFFFFF" opacity="0.45" transform="translate(75, 325) scale(0.9)">
    <path d="M10,6 C10,2 6,0 3,3 C0,0 -4,2 -4,6 C-4,10 3,14 3,14 C3,14 10,10 10,6 Z" />
  </g>
  <g fill="#FFFFFF" opacity="0.45" transform="translate(385, 325) scale(0.9)">
    <path d="M10,6 C10,2 6,0 3,3 C0,0 -4,2 -4,6 C-4,10 3,14 3,14 C3,14 10,10 10,6 Z" />
  </g>
</svg>
