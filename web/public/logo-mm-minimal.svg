<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2BE2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B420;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg2)" />

  <!-- Thin circle border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#8B1A1A" stroke-width="1.5" opacity="0.25" />

  <!-- MM monogram -->
  <text x="256" y="275" text-anchor="middle" dominant-baseline="central"
    font-family="'Crimson Text', 'Georgia', serif"
    font-weight="700" font-size="200" fill="#8B1A1A" letter-spacing="-6">
    MM
  </text>

  <!-- Small decorative dots -->
  <circle cx="130" cy="256" r="4" fill="#8B1A1A" opacity="0.4" />
  <circle cx="382" cy="256" r="4" fill="#8B1A1A" opacity="0.4" />
</svg>
